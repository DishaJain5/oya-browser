<!-- Static trusted collection layout. Page titles and URLs are inserted only as literal text. -->

<aside>
  <div class="collection" aria-current="true">
    <span id="collection-name">Bookmarks</span><span id="collection-count" class="count"></span>
  </div>
  <p class="section-label">WEBSITES</p>
  <div id="sites" aria-label="Filter by website"></div>
  <div class="local-note">Saved on this device.<br />Only for this profile.</div>
</aside>
<main>
  <header>
    <p class="eyebrow"></p>
    <h1 id="title">Bookmarks</h1>
    <p id="description">Good things, kept within reach.</p>
    <button id="manage">Manage…</button>
  </header>
  <label class="search-box"
    ><svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
    >
      <circle cx="10.5" cy="10.5" r="6.5" />
      <path d="m16 16 5 5" /></svg
    ><input
      id="search"
      type="search"
      aria-label="Search bookmarks"
      placeholder="Search bookmarks by title or URL"
      autocomplete="off"
    /><span class="search-key">⌘ / Ctrl F</span></label
  >
  <div class="results-bar">
    <span id="result-count" role="status"></span
    ><label class="sort-label"
      >Sort
      <select id="sort">
        <option value="recent">Most recent</option>
        <option value="title">Title A–Z</option>
        <option value="site">Website</option>
      </select></label
    >
  </div>
  <div class="scroll-area">
    <ul id="results" aria-label="Saved pages"></ul>
    <div id="empty" hidden>
      <div class="empty-mark" aria-hidden="true">☆</div>
      <h2 id="empty-title"></h2>
      <p id="empty-detail"></p>
      <button id="clear-search">Clear filters</button>
    </div>
    <button id="more" hidden>Show more pages</button>
  </div>
  <footer>
    <span id="status" role="status" aria-live="polite"></span><span id="open-hint">Pages open in a new tab</span>
  </footer>
</main>
